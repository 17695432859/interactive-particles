<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ 互动粒子宇宙</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    cursor: crosshair;
    height: 100vh;
  }

  canvas#bg {
    position: fixed; inset: 0;
    z-index: 0;
  }

  /* Floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
  }

  /* HUD */
  .hud {
    position: fixed; top: 24px; left: 24px;
    z-index: 10; color: rgba(255,255,255,0.5);
    font-size: 13px; line-height: 1.8;
  }
  .hud .count { color: #6c63ff; font-weight: 700; }
  .hud .mode-label { color: #ffd700; }

  /* Mode buttons */
  .modes {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%);
    z-index: 10; display: flex; gap: 10px;
  }
  .modes button {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.5);
    padding: 10px 22px; border-radius: 30px;
    font-size: 14px; cursor: pointer;
    backdrop-filter: blur(12px);
    transition: all 0.3s;
    font-family: inherit;
  }
  .modes button:hover {
    border-color: rgba(255,255,255,0.3);
    color: #fff;
    background: rgba(255,255,255,0.1);
  }
  .modes button.active {
    border-color: #6c63ff;
    color: #fff;
    background: rgba(108, 99, 255, 0.2);
    box-shadow: 0 0 20px rgba(108, 99, 255, 0.3);
  }

  /* Ripple on click */
  .ripple {
    position: fixed;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    pointer-events: none;
    z-index: 5;
    animation: rippleOut 0.8s ease-out forwards;
  }
  @keyframes rippleOut {
    0% { width: 0; height: 0; opacity: 1; }
    100% { width: 300px; height: 300px; opacity: 0; }
  }

  /* Glow cursor follower */
  .cursor-glow {
    position: fixed;
    width: 200px; height: 200px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    transition: opacity 0.3s;
  }

  /* Info toast */
  .toast {
    position: fixed; top: 24px; right: 24px;
    z-index: 10;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 20px;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    opacity: 0;
    transform: translateY(-10px);
    transition: all 0.4s;
    max-width: 260px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast em { color: #ffd700; font-style: normal; }

  /* Letter explosion */
  .letter {
    position: fixed;
    font-size: 28px;
    font-weight: 800;
    pointer-events: none;
    z-index: 8;
    color: #fff;
    text-shadow: 0 0 20px currentColor;
    animation: letterFly 1.2s ease-out forwards;
  }
  @keyframes letterFly {
    0% { opacity: 1; transform: translate(0,0) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(var(--rot)); }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="cursor-glow" id="glow"></div>

<div class="hud" id="hud">
  粒子数: <span class="count" id="pcount">0</span><br>
  模式: <span class="mode-label" id="modeLabel">吸引</span><br>
  点击/拖动交互
</div>

<div class="toast" id="toast"></div>

<div class="modes">
  <button class="active" data-mode="attract">🌀 吸引</button>
  <button data-mode="repel">💥 排斥</button>
  <button data-mode="vortex">🌪 漩涡</button>
  <button data-mode="explode">🎆 烟花</button>
  <button data-mode="paint">🎨 涂鸦</button>
</div>

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

// State
let mouse = { x: -999, y: -999, down: false };
let mode = 'attract';
let particles = [];
const MAX = 600;
const glow = document.getElementById('glow');
const modeLabel = document.getElementById('modeLabel');
const pcount = document.getElementById('pcount');
const MODE_NAMES = { attract: '吸引', repel: '排斥', vortex: '漩涡', explode: '烟花', paint: '涂鸦' };

// Color palettes
const palettes = [
  ['#6c63ff','#a78bfa','#c084fc','#818cf8'],
  ['#f472b6','#fb7185','#f9a8d4','#e879f9'],
  ['#34d399','#6ee7b7','#a7f3d0','#2dd4bf'],
  ['#fbbf24','#f59e0b','#fcd34d','#fb923c'],
  ['#38bdf8','#60a5fa','#93c5fd','#22d3ee'],
];
let palette = palettes[0];

class Particle {
  constructor(x, y, vx, vy, size, color, life) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.size = size;
    this.color = color;
    this.life = life || 1;
    this.maxLife = this.life;
    this.trail = [];
  }
  update() {
    // Gravity toward mouse (attract mode)
    if (mouse.x > 0 && mode !== 'paint') {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1;
      const force = Math.min(200, 8000 / dist);

      if (mode === 'attract') {
        this.vx += (dx / dist) * force * 0.003;
        this.vy += (dy / dist) * force * 0.003;
      } else if (mode === 'repel') {
        this.vx -= (dx / dist) * force * 0.005;
        this.vy -= (dy / dist) * force * 0.005;
      } else if (mode === 'vortex') {
        this.vx += (-dy / dist) * force * 0.004;
        this.vy += (dx / dist) * force * 0.004;
        this.vx += (dx / dist) * force * 0.001;
        this.vy += (dy / dist) * force * 0.001;
      }
    }

    this.vx *= 0.98;
    this.vy *= 0.98;
    this.x += this.vx;
    this.y += this.vy;

    // Trail
    if (mode === 'paint') {
      this.trail.push({ x: this.x, y: this.y });
      if (this.trail.length > 20) this.trail.shift();
    }

    // Bounce off walls
    if (this.x < 0) { this.x = 0; this.vx *= -0.7; }
    if (this.x > W) { this.x = W; this.vx *= -0.7; }
    if (this.y < 0) { this.y = 0; this.vy *= -0.7; }
    if (this.y > H) { this.y = H; this.vy *= -0.7; }

    this.life -= 0.003;
  }
  draw() {
    const alpha = Math.max(0, this.life / this.maxLife);

    // Trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.strokeStyle = this.color.replace(')', `,${alpha * 0.3})`).replace('rgb', 'rgba');
      ctx.lineWidth = this.size * 0.6;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
    ctx.fillStyle = this.color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * alpha * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = this.color.replace(')', `,${alpha * 0.08})`).replace('rgb', 'rgba');
    ctx.fill();
  }
}

function randColor() {
  return palette[Math.floor(Math.random() * palette.length)];
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r},${g},${b})`;
}

function spawnParticles(x, y, count = 5, spread = 3) {
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX) particles.shift();
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * spread + 0.5;
    const color = hexToRgb(randColor());
    const size = Math.random() * 4 + 1.5;
    particles.push(new Particle(
      x + (Math.random()-0.5) * 10,
      y + (Math.random()-0.5) * 10,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed,
      size, color, 1
    ));
  }
}

function explodeAt(x, y) {
  palette = palettes[Math.floor(Math.random() * palettes.length)];
  for (let i = 0; i < 40; i++) {
    if (particles.length >= MAX) particles.shift();
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 2;
    const color = hexToRgb(randColor());
    const size = Math.random() * 5 + 2;
    particles.push(new Particle(x, y,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed,
      size, color, 1
    ));
  }
  // Ripple
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  ripple.style.marginLeft = '-150px';
  ripple.style.marginTop = '-150px';
  ripple.style.borderColor = randColor();
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 800);
}

// Letters
function spawnLetter(char, x, y) {
  const el = document.createElement('div');
  el.className = 'letter';
  el.textContent = char;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.color = randColor();
  el.style.setProperty('--dx', (Math.random()-0.5)*200 + 'px');
  el.style.setProperty('--dy', (Math.random()-0.5)*200 + 'px');
  el.style.setProperty('--rot', (Math.random()-0.5)*720 + 'deg');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

// Events
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';

  if (mode === 'paint' && mouse.down) {
    spawnParticles(e.clientX, e.clientY, 3, 1);
  } else if (mouse.down) {
    spawnParticles(e.clientX, e.clientY, 2, 2);
  }
});

canvas.addEventListener('mousedown', e => {
  mouse.down = true;
  if (mode === 'explode') {
    explodeAt(e.clientX, e.clientY);
  } else {
    spawnParticles(e.clientX, e.clientY, 8, 4);
  }
  spawnLetter('✦', e.clientX, e.clientY);
});

canvas.addEventListener('mouseup', () => mouse.down = false);

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
  mouse.down = true;
  if (mode === 'explode') explodeAt(t.clientX, t.clientY);
  else spawnParticles(t.clientX, t.clientY, 8, 4);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
  if (mode === 'paint') spawnParticles(t.clientX, t.clientY, 3, 1);
  else spawnParticles(t.clientX, t.clientY, 2, 2);
}, { passive: false });

canvas.addEventListener('touchend', () => mouse.down = false);

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === '1') setMode('attract');
  if (e.key === '2') setMode('repel');
  if (e.key === '3') setMode('vortex');
  if (e.key === '4') setMode('explode');
  if (e.key === '5') setMode('paint');
  if (e.key === 'c') { particles = []; showToast('已清空所有粒子'); }
  if (e.key === 'p') { palette = palettes[Math.floor(Math.random() * palettes.length)]; showToast('切换配色 ✨'); }
});

// Mode buttons
document.querySelectorAll('.modes button').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

function setMode(m) {
  mode = m;
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  modeLabel.textContent = MODE_NAMES[m];
  showToast(`模式: <em>${MODE_NAMES[m]}</em>`);
}

// Toast
let toastTimer;
function showToast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// Ambient particles
for (let i = 0; i < 60; i++) {
  particles.push(new Particle(
    Math.random() * W, Math.random() * H,
    (Math.random()-0.5)*0.3, (Math.random()-0.5)*0.3,
    Math.random() * 2 + 0.5,
    hexToRgb(['#6c63ff','#a78bfa','#818cf8'][Math.floor(Math.random()*3)]),
    0.6 + Math.random() * 0.4
  ));
}

// Main loop
function loop() {
  ctx.fillStyle = 'rgba(5,5,16,0.15)';
  ctx.fillRect(0, 0, W, H);

  particles.forEach(p => { p.update(); p.draw(); });
  particles = particles.filter(p => p.life > 0);

  pcount.textContent = particles.length;
  requestAnimationFrame(loop);
}
loop();

showToast('拖动 · 点击 · 按 <em>1-5</em> 切换模式');
</script>
</body>
</html>
